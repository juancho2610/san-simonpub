{% extends 'base.html' %}
{% block titulo %}Registro - San Simón Pub{% endblock %}
{% block contenido %}
  <h1>Crear cuenta de cliente</h1>
  <div class="tarjeta">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% include 'usuarios/_captcha.html' %}
      <button class="btn btn-bloque" type="submit">Registrarme</button>
    </form>
  </div>
  <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresar</a></p>
{% endblock %}
