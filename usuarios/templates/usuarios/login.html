{% extends 'base.html' %}
{% block titulo %}Ingresar - San Simón Pub{% endblock %}
{% block contenido %}
  <h1>Ingresar</h1>
  <div class="tarjeta">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-bloque" type="submit">Entrar</button>
    </form>
  </div>
  <p>¿Eres cliente nuevo? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
{% endblock %}
