<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }}</title>
</head>
<body>
  <h1>{{ titulo }}</h1>
  <p>Hola, {{ user.username }}. Tu rol es: {{ user.rol }}.</p>
     {% if user.rol.codigo == 'CLIENTE' %}
	<p><a href="{% url 'menu' %}"> Ver el menu</a></p>
     {% endif %}
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesión</button>
  </form>
</body>
</html>
